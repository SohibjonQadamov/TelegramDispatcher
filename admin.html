<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lazzat Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00000b; --on-primary: #ffffff; --primary-container: #1a1a2e;
            --secondary: #af2b3e; --on-secondary: #ffffff; --secondary-fixed: #ffdada;
            --surface: #fcf8fa; --on-surface: #1c1b1d; --on-surface-variant: #47464c;
            --surface-container: #f1edef; --surface-container-low: #f6f2f4;
            --surface-container-highest: #e5e1e3; --outline-variant: #c8c5cd;
            --error: #ba1a1a; --error-container: #ffdad6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--surface); color: var(--on-surface); padding-bottom: 100px; }
        .page { display: none; animation: fadeIn 0.35s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Header */
        .header { position: fixed; top: 0; width: 100%; z-index: 50; background: var(--surface); border-bottom: 1px solid var(--outline-variant); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
        .header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .header h1 img { width: 32px; height: 32px; border-radius: 8px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .bell-btn { padding: 8px; border-radius: 50%; border: none; background: transparent; cursor: pointer; position: relative; }
        .bell-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--secondary); border-radius: 50%; border: 2px solid var(--surface); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--outline-variant); overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; z-index: 50; background: var(--primary-container); display: flex; justify-content: space-around; padding: 8px 4px 18px; border-radius: 16px 16px 0 0; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.5); background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 12px; transition: 0.2s; }
        .nav-btn.active { color: white; background: var(--secondary); }
        .nav-btn svg { width: 20px; height: 20px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 16px; }
        .stat-card { background: white; border-radius: 16px; padding: 14px; border: 1px solid var(--outline-variant); animation: scaleIn 0.3s ease; }
        .stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--on-surface-variant); }
        .stat-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
        .stat-trend { font-size: 10px; font-weight: 700; margin-top: 2px; }
        .trend-up { color: #059669; }
        .trend-down { color: var(--error); }

        /* Cards */
        .card { background: white; border-radius: 16px; padding: 16px; border: 1px solid var(--outline-variant); margin: 8px 16px; animation: scaleIn 0.3s ease; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 16px; font-weight: 700; }

        /* Quick Actions */
        .quick-actions { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
        .action-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; font-size: 14px; }
        .action-btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 1px solid var(--outline-variant); }

        /* Chips */
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; border: 1px solid var(--outline-variant); background: white; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* Product Card */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 16px; }
        .product-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid var(--outline-variant); animation: scaleIn 0.3s ease; }
        .product-img { width: 100%; height: 120px; object-fit: cover; }
        .product-body { padding: 10px 12px; }
        .product-name { font-size: 13px; font-weight: 700; }
        .product-meta { font-size: 10px; color: var(--on-surface-variant); margin-top: 2px; }
        .product-price { font-size: 14px; font-weight: 700; color: var(--secondary); margin-top: 4px; }
        .product-status { display: inline-block; padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
        .status-sotuvda { background: #d1fae5; color: #065f46; }
        .status-tugagan { background: var(--error-container); color: var(--error); }

        /* Order Card */
        .order-card { background: white; border-radius: 16px; padding: 14px; border: 1px solid var(--outline-variant); margin: 8px 16px; border-left: 4px solid var(--secondary); animation: scaleIn 0.3s ease; }
        .order-id { font-size: 12px; font-weight: 700; color: var(--secondary); }
        .order-customer { font-size: 16px; font-weight: 700; margin-top: 2px; }
        .order-info { font-size: 11px; color: var(--on-surface-variant); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .order-amount { font-size: 18px; font-weight: 700; margin-top: 8px; }

        /* Page content padding */
        .content { padding-top: 70px; }

        /* Bar chart */
        .bar-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 120px; padding: 0 8px; }
        .bar { width: 28px; border-radius: 6px 6px 0 0; transition: 0.3s; }
        .bar-label { text-align: center; font-size: 9px; color: var(--on-surface-variant); margin-top: 4px; }

        /* Settings form */
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--on-surface-variant); margin-bottom: 4px; display: block; }
        .form-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--outline-variant); font-size: 14px; background: var(--surface-container-low); }
        .toggle { width: 44px; height: 24px; border-radius: 12px; background: var(--outline-variant); cursor: pointer; position: relative; transition: 0.2s; border: none; }
        .toggle.on { background: var(--secondary); }
        .toggle::after { content: ''; width: 20px; height: 20px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: 0.2s; }
        .toggle.on::after { left: 22px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>⚙️ Lazzat Admin</h1>
        <div class="header-actions">
            <button class="bell-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="bell-dot"></span></button>
            <div class="avatar"><img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=80&q=80" alt="Admin"></div>
        </div>
    </header>

    <!-- CONTENT -->
    <div class="content">
        <!-- DASHBOARD -->
        <div class="page active" id="page-dashboard">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon" style="background:#e2e0fc;">📦</div><div class="stat-label">Bugungi buyurtmalar</div><div class="stat-value">142</div><div class="stat-trend trend-up">+12%</div></div>
                <div class="stat-card"><div class="stat-icon" style="background:#ffdada;">💰</div><div class="stat-label">Daromad</div><div class="stat-value">14.2M</div><div class="stat-trend trend-up">+8.4%</div></div>
                <div class="stat-card"><div class="stat-icon" style="background:#d1fae5;">🚗</div><div class="stat-label">Faol kuryerlar</div><div class="stat-value">24</div></div>
                <div class="stat-card"><div class="stat-icon" style="background:#fef3c7;">⭐</div><div class="stat-label">Reyting</div><div class="stat-value">4.85</div></div>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Haftalik daromad</span></div>
                <div class="bar-chart" id="barChart"></div>
            </div>

            <div class="quick-actions" style="margin-top:12px;">
                <button class="action-btn btn-primary" onclick="switchPage('products')">➕ Mahsulot qo'shish</button>
                <button class="action-btn btn-outline" onclick="switchPage('products')">📝 Menyuni tahrirlash</button>
                <button class="action-btn btn-outline">📢 Xabar yuborish</button>
            </div>
        </div>

        <!-- PRODUCTS -->
        <div class="page" id="page-products">
            <div class="chips" id="productChips">
                <button class="chip active" onclick="filterProducts('all', this)">Barchasi</button>
                <button class="chip" onclick="filterProducts('Pitsalar', this)">Pitsalar</button>
                <button class="chip" onclick="filterProducts('Burgerlar', this)">Burgerlar</button>
                <button class="chip" onclick="filterProducts('Ichimliklar', this)">Ichimliklar</button>
            </div>
            <div class="product-grid" id="productGrid"></div>
        </div>

        <!-- ORDERS -->
        <div class="page" id="page-orders">
            <div class="chips" id="orderChips">
                <button class="chip active" onclick="filterOrders('all', this)">Barchasi</button>
                <button class="chip" onclick="filterOrders('yangi', this)">Yangi</button>
                <button class="chip" onclick="filterOrders('jarayonda', this)">Jarayonda</button>
                <button class="chip" onclick="filterOrders('yetkazilmoqda', this)">Yetkazilmoqda</button>
            </div>
            <div id="orderList"></div>
        </div>

        <!-- ANALYTICS -->
        <div class="page" id="page-analytics">
            <div class="card"><div class="card-title">Analitika</div><p style="color:var(--on-surface-variant);margin-top:8px;">📊 To'liq hisobotlar tez orada...</p></div>
        </div>

        <!-- SETTINGS -->
        <div class="page" id="page-settings">
            <div class="card">
                <div class="card-title">Asosiy ma'lumotlar</div>
                <div class="form-group"><label class="form-label">Restoran nomi</label><input class="form-input" value="Lazzat Premium Grill"></div>
                <div class="form-group"><label class="form-label">Manzil</label><input class="form-input" value="Toshkent, Yunusobod"></div>
                <div class="form-group"><label class="form-label">Telefon</label><input class="form-input" value="+998 90 123 45 67"></div>
            </div>
            <div class="card" style="margin-top:12px;">
                <div class="card-title">Bildirishnomalar</div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;">
                    <span>Yangi buyurtmalar</span>
                    <button class="toggle on" onclick="this.classList.toggle('on')"></button>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;">
                    <span>Xabarlar</span>
                    <button class="toggle on" onclick="this.classList.toggle('on')"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-dashboard" onclick="switchPage('dashboard')">📊 Asosiy</button>
        <button class="nav-btn" id="nav-products" onclick="switchPage('products')">🍕 Maxsulotlar</button>
        <button class="nav-btn" id="nav-orders" onclick="switchPage('orders')">📋 Buyurtmalar</button>
        <button class="nav-btn" id="nav-analytics" onclick="switchPage('analytics')">📈 Analitika</button>
        <button class="nav-btn" id="nav-settings" onclick="switchPage('settings')">⚙️ Sozlamalar</button>
    </nav>

    <script>
        const PRODUCTS = [
            { id:'1', name:'Margarita Pitsa', category:'Pitsalar', weight:'450g', price:65000, status:'sotuvda', image:'https://images.unsplash.com/photo-1574071318508-1cdbad80ad50?w=400&q=80' },
            { id:'2', name:'Double Burger', category:'Burgerlar', weight:'380g', price:48000, status:'sotuvda', image:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80' },
            { id:'3', name:'Klassik Limonad', category:'Ichimliklar', weight:'0.5L', price:22000, status:'tugagan', image:'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=400&q=80' },
            { id:'4', name:'Pepperoni Pitsa', category:'Pitsalar', weight:'480g', price:72000, status:'sotuvda', image:'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=400&q=80' },
        ];

        const ORDERS = [
            { id:'#A8492', customer:'Alisher Usmonov', phone:'+998 90 123 45 67', time:'12:45', amount:113000, status:'yangi' },
            { id:'#A8495', customer:'Malika Ergasheva', phone:'+998 99 987 65 43', time:'13:10', amount:45000, status:'jarayonda' },
            { id:'#A8496', customer:'Javohir Karimov', phone:'+998 93 456 78 90', time:'12:55', amount:185000, status:'yetkazilmoqda' },
        ];

        let currentFilter = 'all';
        let currentOrderFilter = 'all';

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + page).classList.add('active');
            
            if (page === 'dashboard') renderChart();
            if (page === 'products') renderProducts();
            if (page === 'orders') renderOrders();
        }

        function renderChart() {
            const data = [75, 50, 80, 65, 100, 60, 90];
            const days = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
            document.getElementById('barChart').innerHTML = data.map((v, i) => `
                <div style="text-align:center;">
                    <div class="bar" style="height:${v}%;background:${i===4?'var(--secondary)':'#e2e0fc'}"></div>
                    <div class="bar-label">${days[i]}</div>
                </div>
            `).join('');
        }

        function renderProducts() {
            let filtered = PRODUCTS;
            if (currentFilter !== 'all') filtered = PRODUCTS.filter(p => p.category === currentFilter);
            document.getElementById('productGrid').innerHTML = filtered.map(p => `
                <div class="product-card">
                    <img class="product-img" src="${p.image}" alt="${p.name}">
                    <div class="product-body">
                        <div class="product-name">${p.name}</div>
                        <div class="product-meta">${p.category} • ${p.weight}</div>
                        <div class="product-price">${p.price.toLocaleString()} so'm</div>
                        <span class="product-status ${p.status==='sotuvda'?'status-sotuvda':'status-tugagan'}">${p.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('#productChips .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function renderOrders() {
            let filtered = ORDERS;
            if (currentOrderFilter !== 'all') filtered = ORDERS.filter(o => o.status === currentOrderFilter);
            document.getElementById('orderList').innerHTML = filtered.map(o => `
                <div class="order-card" style="border-left-color:${o.status==='yangi'?'var(--secondary)':o.status==='jarayonda'?'#f59e0b':'#059669'}">
                    <div class="order-id">${o.id} • ${o.time}</div>
                    <div class="order-customer">${o.customer}</div>
                    <div class="order-info">📞 ${o.phone}</div>
                    <div class="order-amount">${o.amount.toLocaleString()} UZS</div>
                </div>
            `).join('');
        }

        function filterOrders(status, btn) {
            currentOrderFilter = status;
            document.querySelectorAll('#orderChips .chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderOrders();
        }

        // INIT
        renderChart();
        renderProducts();
        renderOrders();
    </script>
</body>
</html>
