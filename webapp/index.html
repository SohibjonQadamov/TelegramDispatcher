<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lazzat - Premium Food</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/motion/10.18.0/motion.min.js"></script>
    <style>
        :root {
            --cream: #FAFAF5;
            --burgundy: #800020;
            --burgundy-dark: #600018;
            --charcoal: #1d1b20;
            --white: #FFFFFF;
            --gold: #C9A96E;
            --gray: #8E8E93;
            --gray-light: rgba(29,27,32,0.05);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --cream: #0D0D15;
                --white: #1A1A2E;
                --charcoal: #F0F0F0;
                --gray-light: rgba(255,255,255,0.05);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); background: var(--cream); color: var(--charcoal); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        
        .page { display: none; }
        .page.active { display: block; animation: fadeSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .hidden { display: none !important; }

        @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes bounce-subtle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Glass card */
        .glass { background: rgba(255,255,255,0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(29,27,32,0.05); box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.5); }

        /* Header */
        .header { position: fixed; top: 0; width: 100%; z-index: 50; background: rgba(250,250,245,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(29,27,32,0.05); display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
        .header h1 { font-size: 28px; font-weight: 700; font-style: italic; letter-spacing: -0.5px; }
        .header-btn { background: none; border: none; cursor: pointer; padding: 8px; position: relative; transition: 0.2s; }
        .header-btn:active { transform: scale(0.93); }
        .cart-badge { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; background: var(--burgundy); color: white; font-size: 10px; font-weight: 700; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; z-index: 50; background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-top: 1px solid rgba(29,27,32,0.05); border-radius: 20px 20px 0 0; display: flex; justify-content: space-around; padding: 12px 16px 24px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(29,27,32,0.4); background: none; border: none; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item.active { color: var(--charcoal); }
        .nav-item svg { width: 24px; height: 24px; }

        /* Dynamic Island */
        .dynamic-island { display: flex; justify-content: center; padding: 8px 20px; margin-top: 80px; }
        .island-badge { background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(128,0,32,0.2); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .island-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 2s infinite; }
        .island-arrow { color: var(--burgundy); }

        /* Hero */
        .hero { margin: 0 20px 24px; height: 220px; border-radius: 32px; overflow: hidden; position: relative; }
        .hero img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); display: flex; align-items: flex-end; padding: 24px; }
        .hero h2 { font-size: 24px; font-weight: 700; color: white; font-style: italic; line-height: 1.3; }

        /* Search */
        .search-box { margin: 0 20px 20px; }
        .search-input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(29,27,32,0.05); background: rgba(255,255,255,0.5); backdrop-filter: blur(20px); font-size: 15px; font-family: var(--font); }

        /* Category Pills */
        .cat-pills { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 24px; scrollbar-width: none; }
        .cat-pills::-webkit-scrollbar { display: none; }
        .cat-pill { padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; cursor: pointer; border: 1px solid rgba(29,27,32,0.1); background: transparent; color: rgba(29,27,32,0.6); transition: 0.2s; font-family: var(--font); }
        .cat-pill.active { background: var(--charcoal); color: white; border-color: var(--charcoal); }
        .cat-pill:active { transform: scale(0.95); }

        /* Section Title */
        .section-title { font-size: 22px; font-weight: 700; padding: 0 20px 16px; }

        /* Restaurant Cards */
        .restaurants-row { display: flex; gap: 16px; overflow-x: auto; padding: 0 20px 24px; scrollbar-width: none; }
        .restaurants-row::-webkit-scrollbar { display: none; }
        .restaurant-card { min-width: 260px; height: 340px; border-radius: 32px; overflow: hidden; position: relative; cursor: pointer; transition: 0.3s; }
        .restaurant-card:active { transform: scale(0.97); }
        .restaurant-card img { width: 100%; height: 100%; object-fit: cover; }
        .restaurant-info { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .restaurant-name { font-size: 18px; font-weight: 700; color: white; }
        .restaurant-meta { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.8); }
        .star { color: #facc15; fill: #facc15; }

        /* Product Grid */
        .product-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 20px 100px; }
        .product-card { padding: 16px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .product-card:active { transform: scale(0.98); }
        .product-img { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; }
        .product-info { flex: 1; }
        .product-name { font-size: 16px; font-weight: 700; }
        .product-desc { font-size: 12px; color: rgba(29,27,32,0.6); margin-top: 4px; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--burgundy); margin-top: 4px; }
        .add-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--gray-light); border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; color: var(--charcoal); transition: 0.2s; font-family: var(--font); }
        .add-btn:active { background: var(--burgundy); color: white; transform: scale(0.9); }

        /* Menu Header */
        .menu-header { position: fixed; top: 0; width: 100%; height: 45vh; z-index: 10; overflow: hidden; }
        .menu-header img { width: 100%; height: 100%; object-fit: cover; }
        .menu-header-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; }
        .menu-header h2 { font-size: 32px; font-weight: 700; color: white; font-style: italic; }

        /* Menu Content */
        .menu-content { padding-top: 45vh; position: relative; z-index: 20; }
        .menu-tabs { position: sticky; top: 60px; z-index: 30; background: rgba(250,250,245,0.8); backdrop-filter: blur(20px); padding: 16px 20px; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .menu-tab { padding: 10px 18px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(29,27,32,0.1); background: transparent; cursor: pointer; white-space: nowrap; transition: 0.2s; font-family: var(--font); }
        .menu-tab.active { background: var(--charcoal); color: white; }

        /* Profile */
        .profile-header { padding-top: 80px; }
        .profile-card { margin: 20px; padding: 28px; border-radius: 32px; text-align: center; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.5); }
        .profile-name { font-size: 24px; font-weight: 700; margin-top: 12px; }
        .profile-email { font-size: 14px; color: rgba(29,27,32,0.6); margin-top: 4px; }
        .profile-badge { display: inline-block; padding: 6px 14px; background: #fef3c7; color: #92400e; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 20px; margin-top: 8px; }

        /* Cart Modal */
        .cart-overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; }
        .cart-backdrop { position: absolute; inset: 0; background: rgba(29,27,32,0.2); backdrop-filter: blur(4px); }
        .cart-sheet { position: relative; background: var(--cream); border-radius: 36px 36px 0 0; max-height: 80vh; overflow-y: auto; animation: slideUp 0.4s ease; }
        .cart-handle { display: flex; justify-content: center; padding: 16px; }
        .cart-handle div { width: 48px; height: 5px; background: rgba(29,27,32,0.1); border-radius: 3px; }
        .cart-item { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(29,27,32,0.03); }
        .cart-item-img { width: 60px; height: 60px; border-radius: 16px; object-fit: cover; }
        .qty-control { display: flex; align-items: center; gap: 8px; background: var(--gray-light); border-radius: 20px; padding: 4px 12px; }
        .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font); }
        .cart-footer { padding: 20px; border-top: 1px solid rgba(29,27,32,0.05); }
        .cart-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; font-style: italic; margin-bottom: 12px; }
        .order-btn { width: 100%; padding: 16px; background: var(--burgundy); color: white; border: none; border-radius: 24px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: var(--font); }
        .order-btn:active { transform: scale(0.98); opacity: 0.9; }
        .order-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header" id="mainHeader">
        <h1>Lazzat</h1>
        <button class="header-btn" onclick="showTab('cart')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
            <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
        </button>
    </header>

    <!-- HOME PAGE -->
    <div class="page active" id="page-home">
        <div class="dynamic-island">
            <div class="island-badge">
                <div class="island-dot"></div>
                Yangi chegirmalar!
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </div>
        </div>

        <div class="hero" id="heroSection">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80" alt="Hero">
            <div class="hero-overlay">
                <h2>Premium lazzat,<br>uyingizda</h2>
            </div>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" placeholder="Restoran yoki taom qidirish..." oninput="handleSearch(this.value)">
        </div>

        <div class="cat-pills" id="catPills">
            <button class="cat-pill active" onclick="filterHome('all', this)">Barchasi</button>
            <button class="cat-pill" onclick="filterHome('pizza', this)">Pitsa</button>
            <button class="cat-pill" onclick="filterHome('sushi', this)">Sushi</button>
            <button class="cat-pill" onclick="filterHome('steak', this)">Steyklar</button>
        </div>

        <div class="section-title">Top Restoranlar</div>
        <div class="restaurants-row" id="restaurantsList"></div>

        <div class="section-title">Mashhurlar</div>
        <div class="product-grid" id="popularProducts"></div>
    </div>

    <!-- MENU PAGE -->
    <div class="page" id="page-menu">
        <div class="menu-header" id="menuHeader">
            <img id="menuHeaderImg" src="" alt="">
            <div class="menu-header-overlay">
                <button onclick="showTab('home')" style="position:absolute;top:20px;left:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.2);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);color:white;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;">←</button>
                <h2 id="menuTitle"></h2>
            </div>
        </div>
        <div class="menu-content">
            <div class="menu-tabs" id="menuTabs">
                <button class="menu-tab active" onclick="filterMenu('all', this)">Chef's Picks</button>
                <button class="menu-tab" onclick="filterMenu('main', this)">Asosiy taomlar</button>
                <button class="menu-tab" onclick="filterMenu('drinks', this)">Ichimliklar</button>
            </div>
            <div class="product-grid" id="menuProducts"></div>
        </div>
    </div>

    <!-- PROFILE PAGE -->
    <div class="page" id="page-profile">
        <div class="profile-header">
            <div class="profile-card glass">
                <img class="profile-avatar" src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=200&q=80" alt="Profile" id="profileImg">
                <h2 class="profile-name" id="profileName">Foydalanuvchi</h2>
                <p class="profile-email" id="profileEmail">@username</p>
                <span class="profile-badge">Oltin a'zo</span>
            </div>
        </div>
    </div>

    <!-- CART MODAL -->
    <div class="cart-overlay hidden" id="cartModal">
        <div class="cart-backdrop" onclick="closeCart()"></div>
        <div class="cart-sheet" id="cartSheet">
            <div class="cart-handle"><div></div></div>
            <div style="padding: 0 20px 16px;">
                <h3 style="font-size:28px;font-weight:700;font-style:italic;">Savat</h3>
            </div>
            <div id="cartItems"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Jami:</span>
                    <span id="cartTotal">0 so'm</span>
                </div>
                <button class="order-btn" id="orderBtn" onclick="placeOrder()">Buyurtma berish</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="showTab('home')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Asosiy
        </button>
        <button class="nav-item" id="navCart" onclick="showTab('cart')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>
            Savat
        </button>
        <button class="nav-item" id="navProfile" onclick="showTab('profile')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profil
        </button>
    </nav>
    <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // DATA
    const RESTAURANTS = [
        { id: '1', name: 'Le Sommelier', cuisine: 'Frantsuz taomlari', rating: 4.9, image: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=800&q=80' },
        { id: '2', name: 'Sakura Zen', cuisine: 'Yapon taomlari', rating: 4.8, image: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80' },
    ];

    const MENU_ITEMS = [
        { id: 'm1', name: 'Wagyu Burger', desc: 'Premium mol go\'shti va truffle sousi', price: 85000, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80', category: 'pizza', isChefPick: true, tags: ['ACHCHIQ'] },
        { id: 'm2', name: 'Trufelli Pasta', desc: 'Yangi fettuchini va qora trufel', price: 120000, image: 'https://images.unsplash.com/photo-1473093226795-af9932fe5856?w=400&q=80', category: 'sushi', isChefPick: true, tags: ['VEGAN'] },
        { id: 'm3', name: 'Margarita Pitsa', desc: 'O\'rtacha o\'lcham', price: 65000, image: 'https://images.unsplash.com/photo-1574071318508-1cdbad80ad50?w=400&q=80', category: 'pizza' },
        { id: 'm4', name: 'Lazzat Maxsus', desc: '12 soat dimlangan qo\'zichoq', price: 145000, image: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=400&q=80', category: 'steak', isChefPick: true, tags: ['ACHCHIQ'] },
    ];

    let cart = [];
    let activeTab = 'home';
    let currentRestaurant = null;
    let homeFilter = 'all';
    let menuFilter = 'all';

    // NAVIGATION
    function showTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab)?.classList.add('active');
        
        document.getElementById('mainHeader').classList.toggle('hidden', tab === 'menu');
        document.getElementById('cartModal').classList.toggle('hidden', tab !== 'cart');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if (tab === 'home') document.getElementById('navHome').classList.add('active');
        if (tab === 'cart') document.getElementById('navCart').classList.add('active');
        if (tab === 'profile') document.getElementById('navProfile').classList.add('active');
        
        if (tab === 'cart') renderCart();
        if (tab === 'profile') renderProfile();
    }

    // RENDER HOME
    function renderHome() {
        let filtered = MENU_ITEMS;
        if (homeFilter !== 'all') filtered = MENU_ITEMS.filter(i => i.category === homeFilter);
        
        document.getElementById('restaurantsList').innerHTML = RESTAURANTS.map(r => `
            <div class="restaurant-card" onclick="openMenu('${r.id}')">
                <img src="${r.image}" alt="${r.name}">
                <div class="restaurant-info">
                    <div class="restaurant-name">${r.name}</div>
                    <div class="restaurant-meta">
                        <span class="star">★</span> ${r.rating} • ${r.cuisine}
                    </div>
                </div>
            </div>
        `).join('');

        document.getElementById('popularProducts').innerHTML = filtered.filter(i => !i.isChefPick).map(i => `
            <div class="product-card glass">
                <img class="product-img" src="${i.image}" alt="${i.name}">
                <div class="product-info">
                    <div class="product-name">${i.name}</div>
                    <div class="product-desc">${i.desc}</div>
                    <div class="product-price">${i.price.toLocaleString()} so'm</div>
                </div>
                <button class="add-btn" onclick="addToCart('${i.id}')">+</button>
            </div>
        `).join('');
    }

    function filterHome(cat, btn) {
        homeFilter = cat;
        document.querySelectorAll('#catPills .cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderHome();
    }

    // OPEN MENU
    function openMenu(restaurantId) {
        currentRestaurant = RESTAURANTS.find(r => r.id === restaurantId);
        if (!currentRestaurant) return;
        document.getElementById('menuHeaderImg').src = currentRestaurant.image;
        document.getElementById('menuTitle').textContent = currentRestaurant.name;
        showTab('menu');
        renderMenu();
    }

    function renderMenu() {
        let items = MENU_ITEMS;
        if (menuFilter === 'main') items = MENU_ITEMS.filter(i => !i.isChefPick);
        if (menuFilter === 'drinks') items = MENU_ITEMS.filter(i => i.category === 'drinks');
        
        document.getElementById('menuProducts').innerHTML = items.map(i => `
            <div class="product-card glass">
                <img class="product-img" src="${i.image}" alt="${i.name}">
                <div class="product-info">
                    <div class="product-name">${i.name}</div>
                    <div class="product-desc">${i.desc}</div>
                    <div class="product-price">${i.price.toLocaleString()} so'm</div>
                </div>
                <button class="add-btn" onclick="addToCart('${i.id}')">+</button>
            </div>
        `).join('');
    }

    function filterMenu(cat, btn) {
        menuFilter = cat;
        document.querySelectorAll('#menuTabs .menu-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMenu();
    }

    // CART
    function addToCart(itemId) {
        const item = MENU_ITEMS.find(i => i.id === itemId);
        if (!item) return;
        const existing = cart.find(i => i.id === itemId);
        if (existing) existing.qty++;
        else cart.push({ ...item, qty: 1 });
        updateCartBadge();
    }

    function updateCartBadge() {
        const count = cart.reduce((s, i) => s + i.qty, 0);
        const badge = document.getElementById('cartBadge');
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
        
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(29,27,32,0.4);">Savat bo\'sh</div>';
        } else {
            container.innerHTML = cart.map(i => `
                <div class="cart-item">
                    <img class="cart-item-img" src="${i.image}" alt="${i.name}">
                    <div style="flex:1;">
                        <div style="font-weight:700;">${i.name}</div>
                        <div style="font-weight:700;color:var(--burgundy);">${(i.price * i.qty).toLocaleString()} so'm</div>
                    </div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty('${i.id}', -1)">−</button>
                        <span style="font-weight:700;">${i.qty}</span>
                        <button class="qty-btn" onclick="updateQty('${i.id}', 1)">+</button>
                    </div>
                </div>
            `).join('');
        }
        
        document.getElementById('cartTotal').textContent = total.toLocaleString() + " so'm";
        document.getElementById('orderBtn').disabled = cart.length === 0;
    }

    function updateQty(itemId, delta) {
        const item = cart.find(i => i.id === itemId);
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== itemId);
        updateCartBadge();
        renderCart();
    }

    function closeCart() {
        document.getElementById('cartModal').classList.add('hidden');
        showTab(activeTab === 'cart' ? 'home' : activeTab);
    }

    function placeOrder() {
        if (cart.length === 0) return;
        const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
        const items = cart.map(i => `${i.name} x${i.qty}`).join(', ');
        tg.sendData(JSON.stringify({ action: "order", items, total }));
        cart = [];
        updateCartBadge();
        closeCart();
        tg.close();
    }

    // SEARCH
    function handleSearch(q) {
        if (q.length < 2) { renderHome(); return; }
        const filtered = MENU_ITEMS.filter(i => i.name.toLowerCase().includes(q.toLowerCase()));
        document.getElementById('popularProducts').innerHTML = filtered.map(i => `
            <div class="product-card glass">
                <img class="product-img" src="${i.image}" alt="${i.name}">
                <div class="product-info">
                    <div class="product-name">${i.name}</div>
                    <div class="product-desc">${i.desc}</div>
                    <div class="product-price">${i.price.toLocaleString()} so'm</div>
                </div>
                <button class="add-btn" onclick="addToCart('${i.id}')">+</button>
            </div>
        `).join('');
    }

    // PROFILE
    function renderProfile() {
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('profileName').textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('profileEmail').textContent = user.username ? '@' + user.username : '';
            if (user.photo_url) document.getElementById('profileImg').src = user.photo_url;
        }
    }

    // INIT
    renderHome();
    updateCartBadge();
    renderProfile();
</script>
</body>
</html>
